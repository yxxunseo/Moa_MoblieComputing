spring:
  profiles:
    include: secret
  datasource:
    url: jdbc:mysql://localhost:3306/moa_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  address: 0.0.0.0
  # 브라우저/카톡 공유용 — PC Wi-Fi IP (터미널: ipconfig getifaddr en0)
  public-url: http://localhost:8080

jwt:
  expiration: 86400000
  refresh-expiration: 604800000

# DB 비밀번호, JWT secret, OAuth 키 → application-secret.yml (Git 제외)
google:
  redirect-uri: http://localhost:8080/api/auth/google/callback

kakao:
  redirect-uri: http://localhost:8080/api/auth/kakao/callback

logging:
  level:
    com.example.moa: DEBUG
    org.springframework.security: INFO
