spring:
  config:
    import: optional:classpath:application-secret.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # 로컬: localhost MySQL / Railway: 환경변수 MYSQL_URL 주입
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/moa_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  public-url: ${PUBLIC_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 604800000

# DB 비밀번호, JWT secret, OAuth 키 → application-secret.yml (Git 제외) 또는 환경변수
google:
  redirect-uri: ${PUBLIC_URL:http://localhost:8080}/api/auth/google/callback
  # Android server auth code 교환 시 빈 redirect (웹 로그인 콜백과 분리)
  calendar-redirect-uri: ""
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

kakao:
  redirect-uri: ${PUBLIC_URL:http://localhost:8080}/api/auth/kakao/callback
  client-id: ${KAKAO_CLIENT_ID:}

logging:
  level:
    com.example.moa: INFO
    org.springframework.security: WARN
